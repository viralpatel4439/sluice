apiVersion: v1
kind: Service
metadata:
  name: {{ include "sluice.fullname" . }}
  labels: {{- include "sluice.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "sluice.selector" . | nindent 4 }}
  ports:
    - { name: grpc, port: {{ .Values.service.grpcPort }}, targetPort: grpc, appProtocol: grpc }
    - { name: http, port: {{ .Values.service.httpPort }}, targetPort: http }
