{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sluice.fullname" . }}
  labels: {{- include "sluice.labels" . | nindent 4 }}
type: Opaque
stringData:
  tokens: {{ .Values.auth.tokens | quote }}
  adminToken: {{ .Values.auth.adminToken | quote }}
  viewToken: {{ .Values.auth.viewToken | quote }}
{{- end }}
