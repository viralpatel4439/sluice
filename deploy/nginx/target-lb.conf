# Load balancer in front of the target-service replicas ("service B").
upstream target {
  server target-1:3000;
  server target-2:3000;
  server target-3:3000;
  keepalive 64;
}
server {
  listen 80;
  location / {
    proxy_pass http://target;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
